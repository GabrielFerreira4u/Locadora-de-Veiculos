services:
  # API simulada (JSON Server) em http://localhost:3001
  api:
    build: .
    command: npm run server -- --host 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - .:/app                # código local dentro do container (db.json é salvo no seu projeto)
      - /app/node_modules     # mantém o node_modules do container

  # Aplicação React (Vite) em http://localhost:5173
  web:
    build: .
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true   # garante o hot reload no Windows/Mac
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
